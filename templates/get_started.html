<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | SmartSchool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #b8d9e1; /* Light background */
        }
        .card {
            cursor: pointer; /* Change cursor on hover */
            transition: transform 0.2s; /* Animation on hover */
        }
        .card:hover {
            transform: scale(1.05); /* Scale effect */
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">SmartSchool</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h4 class="text-center">Get Started</h4>
        <div class="row justify-content-center">
            <!-- Student Card -->
            <div class="col-md-4">
                <div class="card mb-4" onclick="window.location='{{ url_for(\'register\') }}'">
                    <div class="card-header bg-info text-white">
                        <h5>Register as Student</h5>
                    </div>
                    <div class="card-body text-center">
                        <p>Join us as a student to start your learning journey.</p>
                    </div>
                </div>
            </div>
            <!-- Teacher Card -->
            <div class="col-md-4">
                <div class="card mb-4" onclick="window.location='{{ url_for(\'/teacher/register\') }}'">
                    <div class="card-header bg-warning text-white">
                        <h5>Register as Teacher</h5>
                    </div>
                    <div class="card-body text-center">
                        <p>Become a teacher and guide students in their learning journey.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
