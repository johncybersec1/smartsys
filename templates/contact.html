<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='fav.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Select a Contact to Chat</h2>
        <ul class="list-group">
            {% for user in users %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ user.first_name }} {{ user.last_name }}</span>
                <a href="{{ url_for('inbox', receiver_id=user.id) }}" class="btn btn-primary">Chat</a>
            </li>
            {% endfor %}
        </ul>
        <div class="mt-3">
            <a href="{{ url_for('stddashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
