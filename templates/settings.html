<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="setstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="settings-page">
        <!-- Back to Dashboard Link -->
        <div class="back-to-dashboard">
            <a href="/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <!-- Grid Container for Cards -->
        <div class="settings-grid">
            <!-- Profile Card -->
            <div class="settings-card profile-card">
                <h3>Profile Settings</h3>
                <div class="profile-section">
                    <img src="{{ url_for('static', filename=session.get('profile_photo', 'default.jpg')) }}" alt="Profile Photo" class="img-fluid mb-3" id="profile-photo" width="100" alt="Profile Picture">
                    <h2>{{ session.get('first_name', 'Student') }} {{ session.get('last_name', '') }}</h2>
                    <form action="/update_profile_photo" method="POST" enctype="multipart/form-data">
                        <label for="profile-photo" class="file-label">
                            <i class="fa fa-camera"></i> Change Photo
                        </label>
                        <input type="file" id="profile-photo" name="profile_photo" accept="image/*">
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </form>
                </div>
            </div>

            <!-- Account Settings Card -->
            <div class="settings-card account-card">
                <h3>Account Settings</h3>
                <form action="" method="POST">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="{{ session.get('email', 'Student') }}" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="text" id="phone" name="phone" placeholder="{{ session.get('phone', 'Student') }}" required>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password:</label>
                        <input type="password" id="password" name="password" placeholder="************" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password:</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="************" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <!-- Appearance Card -->
            <div class="settings-card appearance-card">
                <h3>Appearance Settings</h3>
                <form action="" method="POST">
                    <div class="form-group">
                        <label for="theme">Choose Theme:</label>
                        <select id="theme" name="theme">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Appearance</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
