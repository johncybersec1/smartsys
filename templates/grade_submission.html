<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submission | SmartSchool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='fav.ico') }}" type="image/x-icon">

    <style>
        /* Background */
        body {
            background: linear-gradient(to right, #fe7b7b, #fa6363);
            font-family: 'Arial', sans-serif;
        }
        .navbar {
            background-color: transparent;
        }
        .navbar-brand img {
            height: 40px;
            width: auto;
            margin-right: 6px;
            border-radius: 50px;
        }
        .navbar a.navbar-brand {
            font-weight: bold;
            color: white;
            font-size: 1.8rem;
        }
        .navbar .nav-link {
            color: white !important;
            font-weight: 500;
        }

        /* Grade Submission Card */
        .grade-card {
            max-width: 600px;
            margin: 5% auto;
            padding: 2rem;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .grade-card h2 {
            color: #f36349;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-group label {
            color: #6c757d;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.8rem;
        }
        .btn-cta {
            width: 100%;
            background: linear-gradient(to right, #ff5f5f, #fe7b7b);
            color: white;
            font-size: 1.2rem;
            padding: 0.75rem;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn-cta:hover {
            background: linear-gradient(to right, #fe7b7b, #fa6363);
        }

        /* Custom Footer */
        .footer {
            text-align: center;
            color: white;
            margin-top: 3rem;
            padding: 1rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('teacher_dashboard') }}">
                <img src="{{ url_for('static', filename='S.png') }}" alt="SmartSchool Logo">
                SmartSchool
            </a>
        </div>
    </nav>

    <!-- Grade Submission Card -->
    <div class="grade-card">
        <h2>Grade Submission for {{ submission.student.name }}</h2>
        
        <form action="{{ url_for('grade_submission', submission_id=submission.id) }}" method="POST">
            <div class="form-group">
                <label for="grade">Grade</label>
                <input type="text" class="form-control" id="grade" name="grade" required>
            </div>
            <div class="form-group mt-3">
                <label for="feedback">Feedback</label>
                <textarea class="form-control" id="feedback" name="feedback" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-cta mt-3">Submit Grade</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 SmartSchool. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
