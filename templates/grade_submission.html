<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Grade Submission for {{ submission.student.name }}</h2>
        
        <form action="{{ url_for('grade_submission', submission_id=submission.id) }}" method="POST">
            <div class="form-group">
                <label for="grade">Grade</label>
                <input type="text" class="form-control" id="grade" name="grade" required>
            </div>
            <div class="form-group mt-3">
                <label for="feedback">Feedback</label>
                <textarea class="form-control" id="feedback" name="feedback" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Submit Grade</button>
        </form>
    </div>
</body>
</html>
