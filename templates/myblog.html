<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic }} Blogs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #8e44ad, #3498db);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f4f4f4;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
        }

        .topic-select {
            margin-top: 20px;
        }

        .topic-select select {
            width: 25%;
            margin-right: 10px;
        }

        .topic-select button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
        }

        .topic-select button:hover {
            background-color: #2980b9;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            min-height: 380px; /* Ensures card height consistency */
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
        }

        .card-body h5 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: #f4f4f4;
        }

        .card-body p {
            font-size: 1rem;
            color: #eaeaea;
            margin-bottom: 15px;
        }

        .card-footer {
            font-size: 0.9rem;
            color: #ccc;
            padding: 10px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #ccc;
        }

        @media (min-width: 1200px) {
            .col-md-4 {
                flex: 0 0 30%;
            }
        }

        @media (max-width: 768px) {
            .col-md-4 {
                flex: 0 0 48%; /* Adjust for tablet view */
            }
        }

        @media (max-width: 576px) {
            .col-md-4 {
                flex: 0 0 100%; /* Adjust for mobile view */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ topic.capitalize() }} Blogs</h1>

        <!-- Topic Selection Form -->
        <form method="get" action="/blogs" class="topic-select">
            <label for="topic">Choose a topic:</label>
            <select id="topic" name="topic" class="form-select">
                {% for key, _ in topics.items() %}
                <option value="{{ key }}" {% if key == topic.lower() %}selected{% endif %}>{{ key.capitalize() }}</option>
                {% endfor %}
            </select>
            <button type="submit">Go</button>
        </form>

        <!-- Blog Posts -->
        <div class="row">
            {% for post in posts %}
            <div class="col-md-4">
                <div class="card">
                    {% if post.image_url %}
                    <img src="{{ post.image_url }}" alt="Blog Thumbnail">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text">{{ post.summary | safe }}</p>
                        <a href="{{ post.link }}" target="_blank" class="btn btn-primary">Read More</a>
                    </div>
                    <div class="card-footer text-muted">
                        Published: {{ post.published }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <footer>
            &copy; 2024 SmartSchool. All Rights Reserved.
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
