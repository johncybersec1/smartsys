<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic }} Blogs</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">{{ topic }} Blogs</h1>
        
        <!-- Topic Selection -->
        <form method="get" action="/blogs" class="text-center topic-select mb-4">
            <label for="topic">Choose a topic:</label>
            <select id="topic" name="topic" class="form-select w-25 d-inline">
                {% for key, _ in topics.items() %}
                <option value="{{ key }}" {% if key == topic.lower() %}selected{% endif %}>{{ key.capitalize() }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-primary">Go</button>
        </form>

        <!-- Blog Posts -->
        <div class="row">
            {% for post in posts %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    {% if post.image_url %}
                    <img src="{{ post.image_url }}" class="card-img-top" alt="Blog Thumbnail">
                    {% else %}
                    <img src="https://via.placeholder.com/350x200" class="card-img-top" alt="Placeholder Image">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text">{{ post.summary | safe }}</p>
                        <a href="{{ post.link }}" target="_blank" class="btn btn-primary">Read More</a>
                    </div>
                    <div class="card-footer text-muted">
                        Published: {{ post.published }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
