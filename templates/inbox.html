<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-box {
            max-height: 500px;
            overflow-y: auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
        }

        .chat-message {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .chat-message.me {
            justify-content: flex-end;
        }

        .chat-message .content {
            padding: 10px 20px;
            border-radius: 20px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .chat-message.me .content {
            background-color: #dc3545;
            color: white;
        }

        .chat-message.them .content {
            background-color: #f1f1f1;
            color: black;
        }

        .message-input {
            position: relative;
        }

        .message-input textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
        }

        .message-input button {
            position: absolute;
            right: 10px;
            top: 10px;
            padding: 12px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Chat</h2>

                <!-- Chat Messages -->
                <div class="chat-box" id="chat-box">
                    {% for message in messages %}
                    <div class="chat-message {% if message.sender_id == session['user_id'] %}me{% else %}them{% endif %}">
                        <div class="content">
                            <p>{{ message.content }}</p>
                            <small class="text-muted">{{ message.timestamp }}</small>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Message Input Box -->
                <div class="message-input mt-4">
                    <form action="{{ url_for('inbox', receiver_id=receiver_id) }}" method="POST">
                        <textarea name="content" placeholder="Type a message..." required></textarea>
                        <button type="submit">Send</button>
                    </form>
                </div>

                <div class="mt-3">
                    <a href="{{ url_for('contact') }}" class="btn btn-secondary">Select Another Contact</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
