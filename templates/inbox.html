<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Real-Time Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        /* Basic styles for the chat */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 10px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h3 {
            margin: 0;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .chat-message {
            margin-bottom: 15px;
        }

        .chat-message.them {
            text-align: left;
        }

        .chat-message.me {
            text-align: right;
        }

        .chat-message .content {
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            max-width: 60%;
        }

        .chat-message.me .content {
            background-color: #007bff;
            color: white;
        }

        .chat-message.them .content {
            background-color: #f1f1f1;
            color: black;
        }

        .chat-message small {
            display: block;
            margin-top: 5px;
            font-size: 0.8em;
        }

        .chat-form {
            display: flex;
            gap: 10px;
        }

        .chat-form input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .chat-form button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }

        .chat-form button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Chat header with receiver's name -->
    <div class="chat-header">
        <h3>Chat with {{ receiver.first_name }} {{ receiver.last_name }}</h3>
    </div>

    <!-- Chat box where messages will be displayed -->
    <div id="chat-box" class="chat-box">
        {% for message in messages %}
        <div class="chat-message {% if message.sender_id == session['user_id'] %}me{% else %}them{% endif %}">
            <div class="content">
                <p>{{ message.content }}</p>
                <small class="text-muted">{{ message.timestamp }}</small>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Chat form for sending messages -->
    <form class="chat-form">
        <input type="text" name="content" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</div>

<!-- Real-Time SocketIO Script -->
<script>
    // Connect to the SocketIO server
    const socket = io();

    // Get the user and receiver IDs from your session or hidden input fields
    const senderId = "{{ session['user_id'] }}";
    const receiverId = "{{ receiver_id }}";

    // Join the room for real-time communication
    socket.emit('join_room', { sender_id: senderId, receiver_id: receiverId });

    // Listen for incoming messages and append them to the chatbox
    socket.on('receive_message', function (data) {
        const chatBox = document.getElementById('chat-box');
        const messageDiv = document.createElement('div');

        // Determine if the message is from the current user or the receiver
        const messageClass = data.sender_id == senderId ? 'me' : 'them';
        messageDiv.classList.add('chat-message', messageClass);

        messageDiv.innerHTML = `
            <div class="content">
                <p>${data.content}</p>
                <small class="text-muted">${data.timestamp}</small>
            </div>
        `;
        
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;  // Auto-scroll to the bottom
    });

    // Handle form submission and send the message via SocketIO
    document.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        const content = e.target.elements['content'].value;

        // Emit the message to the server
        socket.emit('send_message', {
            sender_id: senderId,
            receiver_id: receiverId,
            content: content
        });

        // Clear the input field after sending the message
        e.target.elements['content'].value = '';
    });
</script>

</body>
</html>
