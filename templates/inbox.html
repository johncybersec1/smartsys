<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .chat-box {
            max-height: 500px;
            overflow-y: auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
        }

        .chat-message {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .chat-message.me {
            justify-content: flex-end;
        }

        .chat-message .content {
            padding: 10px 20px;
            border-radius: 20px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .chat-message.me .content {
            background-color: #dc3545;
            color: white;
        }

        .chat-message.them .content {
            background-color: #f1f1f1;
            color: black;
        }

        .message-input {
            position: relative;
        }

        .message-input textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
        }

        .message-input button {
            position: absolute;
            right: 10px;
            top: 10px;
            padding: 12px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Inbox</h2>

                <!-- Chat Messages -->
                <div class="chat-box" id="chat-box">
                    {% for message in messages %}
                    <div class="chat-message {% if message.sender_id == session['user_id'] %}me{% else %}them{% endif %}">
                        <div class="content">
                            <p>{{ message.content }}</p>
                            <small class="text-muted">{{ message.timestamp }}</small>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Message Input Box -->
                <div class="message-input mt-4">
                    <textarea id="message-content" placeholder="Type a message..."></textarea>
                    <button id="send-message">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        var socket = io();

        // Join a room for private messages
        socket.emit('join_room', {
            sender_id: {{ session['user_id'] }},
            receiver_id: 1  // Replace with the dynamic receiver ID
        });

        // Capture the send button click
        document.getElementById('send-message').onclick = function() {
            var messageContent = document.getElementById('message-content').value;
            if (messageContent) {
                socket.emit('send_message', {
                    sender_id: {{ session['user_id'] }},
                    receiver_id: 1, // Replace with dynamic receiver ID
                    content: messageContent
                });
                document.getElementById('message-content').value = '';  // Clear the input field
            }
        };

        // Receive and display messages in real-time
        socket.on('receive_message', function(data) {
            var chatBox = document.getElementById('chat-box');
            var messageClass = data.sender_id == {{ session['user_id'] }} ? 'me' : 'them';

            var newMessage = `
                <div class="chat-message ${messageClass}">
                    <div class="content">
                        <p>${data.content}</p>
                        <small class="text-muted">${data.timestamp}</small>
                    </div>
                </div>
            `;
            chatBox.innerHTML += newMessage;
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to the bottom
        });
    </script>
    <div class="collapse navbar-collapse" id="navbarNav">
        <a href="{{ url_for('stddashboard') }}">
          <button>Back to dashboard</button>
        </a>
        <a href="{{ url_for('logout') }}">
          <button>Logout</button>
        </a>
    </div>
</body>
</html>
