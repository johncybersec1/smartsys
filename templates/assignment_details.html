<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='fav.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="container mt-5">
        <h2>{{ assignment.title }}</h2>
        <p><strong>Due Date:</strong> {{ assignment.due_date.strftime('%Y-%m-%d') }}</p>
        <p><strong>Description:</strong> {{ assignment.description }}</p>
        <a href="{{ url_for('stddashboard') }}" class="btn btn-secondary mt-4">Back to Dashboard</a>
    </div>
</body>
</html>
