<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | SmartSchool</title>
    <!-- Bootstrap CSS for styling the table -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (optional) -->
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Student Dashboard</h2>

        <!-- Class Timetable Section -->
        <div class="mb-5">
            <h3 class="text-center mb-4">Class Timetable</h3>
            <div class="table-responsive">
                <!-- Timetable will be dynamically injected here from the Python backend -->
                {{ timetable_html|safe }}
            </div>
        </div>

        <!-- You can add other sections of the dashboard below as needed -->
        
        <!-- Example: Additional dashboard content like assignments, announcements, etc. -->
        <div class="mt-4">
            <h4>Recent Announcements</h4>
            <p>No new announcements at this time.</p>
        </div>

    </div>

    <!-- Bootstrap JS for table responsiveness -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
