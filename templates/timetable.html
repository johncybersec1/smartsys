<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable | SmartSchool</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #b8d9e1; /* Light background for contrast */
            font-family: 'Arial', sans-serif;
        }
        h4 {
            color: #343a40; /* Darker text color for headings */
            margin-bottom: 20px; /* Spacing below the title */
        }
        .table {
            border-radius: 10px; /* Rounded corners for table */
            overflow: hidden; /* Ensure no overflow */
        }
        th {
            background-color: #007bff; /* Blue header */
            color: white; /* White text for headers */
        }
        td {
            background-color: #686ee5; /* White background for cells */
            transition: background-color 0.3s; /* Smooth background transition */
        }
        td:hover {
            background-color: #f06fe1; /* Light blue on hover */
        }
        .no-class {
            color: #6c757d; /* Grey color for "No class" text */
            font-style: italic; /* Italics for better emphasis */
        }
        .footer {
            margin-top: 20px; /* Spacing for footer */
            background-color: #343a40; /* Dark footer background */
            color: white; /* White text for footer */
            text-align: center; /* Center footer text */
            padding: 10px 0; /* Padding for footer */
            position: relative;
            bottom: 0;
            width: 100%;
        }
        .pagination {
            justify-content: center; /* Center pagination links */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h4 class="text-center">Your Timetable</h4>
        <div id="timetable-content">
            {{ timetable_html | safe }}  <!-- Render the timetable HTML here -->
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination">
                {% if page > 1 %}
                    <li class="page-item">
                        <a class="page-link" href="{{ url_for('timetable', page=page-1) }}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                {% endif %}
                {% for p in range(1, total_pages + 1) %}
                    <li class="page-item {% if p == page %}active{% endif %}">
                        <a class="page-link" href="{{ url_for('timetable', page=p) }}">{{ p }}</a>
                    </li>
                {% endfor %}
                {% if page < total_pages %}
                    <li class="page-item">
                        <a class="page-link" href="{{ url_for('timetable', page=page+1) }}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                {% endif %}
            </ul>
        </nav>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 SmartSchool. All rights reserved.</p>
            <p>
                <a href="#" class="text-white">Privacy Policy</a> | <a href="#" class="text-white">Terms of Service</a>
            </p>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
