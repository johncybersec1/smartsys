<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Language Tutor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 20px;
            resize: none;
        }
        button {
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ask the AI Tutor</h1>
        <textarea id="userInput" placeholder="Type your question..."></textarea>
        <button onclick="askAI()">Ask</button>
        <div id="responseContainer" class="response" style="display: none;"></div>
    </div>

    <script>
        async function askAI() {
            const userInput = document.getElementById("userInput").value;
            const responseContainer = document.getElementById("responseContainer");

            if (!userInput.trim()) {
                responseContainer.style.display = "block";
                responseContainer.textContent = "Please enter a question.";
                return;
            }

            responseContainer.style.display = "block";
            responseContainer.textContent = "Thinking...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: userInput }),
                });

                if (!response.ok) {
                    throw new Error("Failed to get a response from the server.");
                }

                const data = await response.json();
                responseContainer.textContent = data.response || "No response from AI.";
            } catch (error) {
                responseContainer.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
